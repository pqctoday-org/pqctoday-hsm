name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Ubuntu 24.04 / OpenSSL 3.3)
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: /opt/openssl-3.6/lib64/pkgconfig:/opt/openssl-3.6/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/openssl-3.6/lib64:/opt/openssl-3.6/lib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake g++ pkg-config \
            libcppunit-dev

      - name: Cache OpenSSL 3.6
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /opt/openssl-3.6
          key: ${{ runner.os }}-openssl-3.6-master-v1

      - name: Build and Install OpenSSL 3.6
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/openssl-3.6
          sudo chown -R $USER:$USER /opt/openssl-3.6
          git clone --depth 1 https://github.com/openssl/openssl.git
          cd openssl
          ./config --prefix=/opt/openssl-3.6 --openssldir=/opt/openssl-3.6/ssl shared
          make -j$(nproc)
          make install

      - name: Verify OpenSSL version
        run: /opt/openssl-3.6/bin/openssl version

      - name: CMake configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DOPENSSL_ROOT_DIR=/opt/openssl-3.6

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  constants-gate:
    name: PKCS#11 Constants Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check PKCS#11 constants (rust + js + kmip manifest vs pkcs11t.h)
        run: python3 scripts/check_pkcs11_constants.py

  rust-test:
    name: Rust Tests (engine + KMIP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            kmip/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock', 'kmip/Cargo.lock') }}
      - name: Run engine tests
        # RUST_MIN_STACK: mceliece6688128's keygen needs more than the default
        # test-thread stack in an unoptimized debug build — seen overflowing
        # on ubuntu-24.04 x86_64 (not reliably reproduced on local aarch64).
        run: cd rust && RUST_MIN_STACK=134217728 cargo test
      - name: Run KMIP tests
        run: cd kmip && cargo test --quiet

  kmip-conformance:
    name: KMIP OASIS Conformance Replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            kmip/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock', 'kmip/Cargo.lock') }}
      - name: Verify python3 (stdlib only — no pip deps)
        run: python3 --version
      - name: Build release KMIP server
        run: cd kmip && cargo build --release --bin pqctoday-kmip

      # The OASIS replay drives all 102 transcripts through the real
      # release server over TLS (self-signed cert auto-generated at
      # startup in --store-memory mode — fully hermetic, no cert files).
      # The harness exits non-zero on FAIL/ERROR (primary gate).
      - name: Run OASIS conformance replay
        run: cd kmip && python3 conformance/harness/dispatcher_replay.py

      # Belt-and-suspenders: assert the JSON summary matches the
      # documented 92/0/10 baseline (5 deprecated + 2 precondition +
      # 3 policy-variant). A NEW skip silently appearing shrinks the
      # pass denominator and hides a regression — fail on skip-set drift.
      - name: Assert replay baseline (92 PASS / 0 FAIL / 10 SKIP)
        run: cd kmip && python3 conformance/assert_replay_report.py

      # Staleness guard: the committed REPLAY_REPORT.{md,json} must match
      # the fresh run just produced (timestamp excluded). This is the gate
      # whose absence let a stale 1-test report hide a 92->89 regression.
      - name: Assert committed report is not stale
        run: cd kmip && python3 conformance/check_report_fresh.py

  kmip-pqc-conformance:
    name: KMIP PQC Interop Replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            kmip/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock', 'kmip/Cargo.lock') }}
      - name: Verify python3 (stdlib only — no pip deps)
        run: python3 --version
      - name: Build release KMIP server
        run: cd kmip && cargo build --release --bin pqctoday-kmip

      # Drives a vendored, structurally-complete subset of the OASIS KMIP
      # 3.0 PQC interop set (kmip-3-0-pqc-tests-03.zip) through the real
      # release server over TLS: keygen (ML-DSA/ML-KEM/SLH-DSA, all param
      # sets, SeedPrivateKey + Raw export), ML-KEM encapsulate/decapsulate,
      # and ML-DSA/SLH-DSA sign/verify — byte-exact. The full 1452-case
      # corpus is not vendored (several MB); point KMIP_REPLAY_CORPUS at a
      # local checkout to replay it all. The slow SLH-DSA "s" siggen
      # transcripts are intentionally excluded to keep CI fast.
      - name: Run PQC interop replay (vendored subset)
        run: cd kmip && KMIP_REPLAY_CORPUS=conformance/pqc_corpus python3 conformance/harness/dispatcher_replay.py

  deprecated-api-check:
    name: Deprecated OpenSSL API Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for deprecated OpenSSL API usage
        run: |
          echo "=== Scanning for removed/deprecated OpenSSL 1.x APIs ==="
          DEPRECATED=(
            "RSA_private_encrypt"
            "RSA_public_decrypt"
            "RSA_blinding_on"
            "RSA_blinding_off"
            "RSA_generate_key_ex"
            "ECDSA_do_sign"
            "ECDSA_do_verify"
            "ECDH_compute_key"
            "EC_KEY_new"
            "EC_KEY_free"
            "EC_KEY_set_group"
            "EC_KEY_get0_public_key"
            "EVP_PKEY_set1_RSA"
            "EVP_PKEY_set1_EC_KEY"
            "EVP_PKEY_get1_RSA"
            "EVP_PKEY_get1_EC_KEY"
            "ENGINE_by_id"
            "RSA_set_method"
            "ECDSA_set_method"
            "OpenSSL_add_all_algorithms"
          )
          FOUND=0
          for sym in "${DEPRECATED[@]}"; do
            hits=$(grep -rn "$sym" src/lib/crypto/ --include="*.cpp" --include="*.h" || true)
            if [ -n "$hits" ]; then
              echo "DEPRECATED API FOUND: $sym"
              echo "$hits"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "ERROR: Deprecated API usage detected. Fix before merging."
            exit 1
          else
            echo "OK: No deprecated OpenSSL API usage found."
          fi

  python-client:
    name: Python client tests (pqctoday-kmip-client)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e "kmip/python-client[dev]"
      - name: Run unit tests
        run: python -m pytest kmip/python-client/tests/ -v --tb=short
      - name: Build wheel (smoke check — no deprecation warnings)
        run: |
          pip install build
          cd kmip/python-client
          python -m build --wheel 2>&1 | tee /tmp/build.log
          if grep -i "DeprecationWarning\|SetuptoolsDeprecationWarning" /tmp/build.log; then
            echo "ERROR: Deprecation warnings in wheel build."
            exit 1
          fi
          echo "Clean build."
