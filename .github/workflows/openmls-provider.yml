name: OpenMLS Provider (Rust)

on:
  push:
    branches: [main]
    paths:
      - 'openmls-provider/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/openmls-provider.yml'
  pull_request:
    branches: [main]
    paths:
      - 'openmls-provider/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/openmls-provider.yml'

jobs:
  rust:
    name: Check / Test / Clippy (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      OPENSSL_VERSION: 3.6.3
      PKG_CONFIG_PATH: /opt/openssl-3.6/lib64/pkgconfig:/opt/openssl-3.6/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/openssl-3.6/lib64:/opt/openssl-3.6/lib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install build dependencies (softhsmv3 + protoc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake g++ pkg-config \
            libcppunit-dev \
            protobuf-compiler

      # PINNED to a release — see the same block in ci.yml for why. In short: this
      # used to clone openssl master, so /opt/openssl-3.6 held OpenSSL 4.1.0-dev.
      # Keep this in step with ci.yml; both jobs share the cache path.
      - name: Cache OpenSSL ${{ env.OPENSSL_VERSION }}
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /opt/openssl-3.6
          key: ${{ runner.os }}-openssl-${{ env.OPENSSL_VERSION }}-release-v1

      - name: Build and Install OpenSSL ${{ env.OPENSSL_VERSION }}
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/openssl-3.6
          sudo chown -R $USER:$USER /opt/openssl-3.6
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix=/opt/openssl-3.6 --openssldir=/opt/openssl-3.6/ssl shared
          make -j$(nproc)
          make install_sw

      - name: Verify OpenSSL version
        run: |
          ACTUAL="$(/opt/openssl-3.6/bin/openssl version)"
          echo "$ACTUAL"
          case "$ACTUAL" in
            "OpenSSL ${OPENSSL_VERSION} "*) ;;
            *) echo "::error::expected OpenSSL ${OPENSSL_VERSION}, got: $ACTUAL"; exit 1 ;;
          esac

      - name: Build softhsmv3 (provides libsofthsmv3.so for interop tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DOPENSSL_ROOT_DIR=/opt/openssl-3.6
          cmake --build build -j$(nproc) --target softhsmv3
          # interop/src/lib.rs::resolve_module() looks for this exact path
          ls -la build/src/lib/libsofthsmv3.so

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            openmls-provider/target
          key: ${{ runner.os }}-cargo-openmls-provider-${{ hashFiles('openmls-provider/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openmls-provider-

      - name: cargo check
        working-directory: openmls-provider
        run: cargo check --workspace

      - name: cargo test
        working-directory: openmls-provider
        env:
          # softhsmv3 built above; interop gRPC tests need this to initialise.
          PKCS11_MODULE: ${{ github.workspace }}/build/src/lib/libsofthsmv3.so
          RUST_LOG: warn
        run: >
          cargo test --workspace
          --exclude pqctoday-mls-wasm-smoke
          -- --test-threads=1

      - name: Build interop binary
        working-directory: openmls-provider
        run: cargo build --release -p pqctoday-mls-interop --bin pqctoday-mls-grpc

      - name: cargo clippy
        working-directory: openmls-provider
        run: >
          cargo clippy --workspace
          --exclude pqctoday-mls-wasm-smoke
          -- -D warnings
