[package]
name        = "pqctoday-kmip"
version     = "0.17.0"
edition     = "2024"
license     = "MIT"
description = "KMIP 3.0 PQC + classical key management wrapper over pqctoday-hsm PKCS#11"
repository  = "https://github.com/pqctoday-org/pqctoday-hsm"

[lib]
name = "pqctoday_kmip"
path = "src/lib.rs"

[[bin]]
name = "pqctoday-kmip"
path = "bin/pqctoday-kmip.rs"

[[bin]]
name = "pqctoday-kmip-client"
path = "bin/pqctoday-kmip-client.rs"

[[bin]]
name = "pqctoday-kmip-compliance"
path = "bin/pqctoday-kmip-compliance.rs"

# Build-time spec extractor — walks OASIS KMIP 3.0 HTML to produce
# spec/oasis-kmip-3.0/kmip-spec-3.0-tags-enums.json. Run on demand:
# `cargo run --bin extract-kmip-spec`. Not a shipping binary.
[[bin]]
name = "extract-kmip-spec"
path = "tools/extract_kmip_spec.rs"

[features]
# `native` = the full server surface. Everything gated here either does NOT
# compile to `wasm32-unknown-unknown` — the TLS transport (tokio + rustls),
# the bundled-SQLite durable store (rusqlite), and the async OTLP/SSE audit
# legs — or is only needed by the server binaries (Prometheus `/metrics`,
# the OASIS spec-extractor's HTML scraper). `dep:rcgen` stays here for now
# too, but ONLY as a test-fixture generator (`certify.rs`'s/`validate.rs`'s
# `#[cfg(test)]` modules use it to build independent CSR/cert fixtures to
# verify against) — since the pure-Rust cert-ops port, neither Certify nor
# Validate's PRODUCTION code calls rcgen or `x509-parser`'s `verify`
# feature (dropped entirely — `x509-parser` is still a base dependency,
# used unconditionally for pure-Rust PARSING only) for any crypto; both
# now go through `ops::spki_verify::verify_with_spki` → the engine, same
# as everything else. Certify/Validate remain behind this gate only
# because `ops/mod.rs` and the dispatcher still `#[cfg(feature =
# "native")]` those two modules structurally — removing that is tracked
# separately (cert-ops plan WP4), not a crypto-backend limitation anymore.
#
# Disable with `--no-default-features` to build the lean, transport-free
# library core that the in-browser wasm bundle (`../wasm`) links against:
# codec + kmip30/wire + dispatcher + policy + ops (minus Certify/Validate,
# pending WP4) + the in-memory `MemoryStore`, driving `softhsmrustv3`
# directly. The native server build (`cargo build`, the three shipping
# `[[bin]]`s) keeps the default features on and is completely unchanged.
default = ["native"]
native = [
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:rusqlite",
    "dep:rusqlite_migration",
    "dep:prometheus",
    "dep:scraper",
]

[dependencies]
# Plane 3 — direct Rust dependency on the engine, NO FFI
softhsmrustv3 = { path = "../rust" }

# Async runtime + I/O — `native` only (no wasm transport).
tokio        = { version = "1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
# `ring` backs the KMIP listener; `aws_lc_rs` backs the cryptopolicy-manager
# admin facade (the only provider exposing the X25519MLKEM768 PQC hybrid KEX).
rustls       = { version = "0.23", features = ["ring", "aws_lc_rs"], optional = true }
rustls-pemfile = { version = "2", optional = true }

# Self-signed cert auto-gen for sandbox / dev runs (Phase 7).
# Production deployments mount real certs via --tls-cert / --tls-key.
#
# TEST-ONLY beyond that (as of the pure-Rust cert-ops port): the §6.1.6
# Certify CSR path used to verify inbound CSRs via rcgen's `x509-parser`
# feature (`CertificateSigningRequestParams::from_der`) — dropped because
# rcgen/aws_lc_rs has no ML-DSA in its SignatureAlgorithm table, so a
# genuinely-valid PQC-signed CSR was rejected as `Invalid CSR`.
# `certify.rs::parse_pkcs10_csr` now verifies via
# `ops::spki_verify::verify_with_spki` (pure-Rust `x509-cert`/`der`/`spki`
# decode + the engine's own `C_Verify`), which has no such gap. rcgen
# stays as a dependency purely so `certify.rs`'s tests can independently
# CONSTRUCT rcgen-signed CSR/cert fixtures (a genuinely external producer
# to verify against) — kept enabled, not test-scoped, since it also still
# backs the sandbox/dev TLS auto-gen above.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"], optional = true }

# P2.3 — KMIP 3.0 §6.1.6 Certify / §6.1.50 Re-certify: the server acts as
# a PQC-capable X.509 CA. rcgen 0.13 can parse CSRs and issue RSA/ECDSA/
# Ed25519 certs, but its SignatureAlgorithm table has NO ML-DSA, so it
# CANNOT issue PQC-signed certs. We need a lower-level X.509 builder that
# accepts ARBITRARY AlgorithmIdentifiers (id-ml-dsa-* OIDs) so the
# TBSCertificate can be signed in the engine for every algorithm. The
# RustCrypto `x509-cert` crate (MIT/Apache, well-maintained) builds
# `TbsCertificate{version, serial, signature alg, issuer, validity,
# subject, SPKI, extensions}` and `Certificate{tbs, sigAlg, signature}`
# with custom alg OIDs and encodes via `der`. Versions pinned to the set
# already resolved in Cargo.lock via `rsa` / `x509-parser` / `ecdsa`
# (der 0.7, spki 0.7, const-oid 0.9) so no second copy is pulled in.
x509-cert = { version = "0.2", default-features = false, features = ["builder"] }
der       = { version = "0.7", features = ["oid", "alloc"] }
spki      = { version = "0.7", features = ["alloc"] }
const-oid = { version = "0.9", features = ["db"] }

# Persistence — `native` only (bundled SQLite C will not cross-compile to
# wasm32; the wasm build uses the in-memory `store::MemoryStore`).
rusqlite           = { version = "0.32", features = ["bundled"], optional = true }
rusqlite_migration = { version = "1", optional = true }

# Phase 2 — TTLV codec buffer ops. `bytes::BytesMut` matches the
# `fn encode(value: &Value, buf: &mut BytesMut)` signature in
# IMPLEMENTATION_PLAN.md §6 Phase 2. Decode side is hand-rolled
# nom-style position tracking against `&[u8]`.
bytes = "1"

# Phase 3 — UsageMask flag set in `src/kmip30/attrs.rs`. `bitflags`
# generates `contains`/`bits()`/bitwise-or so handler code reads
# flags by name rather than poking at raw `u32`.
bitflags = "2"

# Serialization (policy + spec JSON + compliance profiles)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing            = "0.1"
tracing-subscriber = "0.3"
# D1 — Prometheus /metrics scrape endpoint for the CACP management plane.
# `native` only — the wasm build compiles `crate::metrics` out entirely.
prometheus = { version = "0.13", default-features = false, optional = true }

# Crypto helpers (NOT for PQC — that's softhsmrustv3 — only for TLS bootstrap)
rand        = "0.8"
sha2        = "0.10"
hmac        = "0.12"
# Gap-remediation Phase A — Destroy must scrub Register/Import'd
# ObjectRecord.key_material, not just flip the lifecycle state. Same
# crate + `.zeroize()` discipline `rust/src/ffi.rs` already uses.
zeroize     = "1"
# K20 — Derive Key PBKDF2 method (RFC 2898 via the RustCrypto crate;
# same version the engine uses for TokenState PIN hashing).
pbkdf2      = "0.12"

# IDs
uuid = { version = "1", features = ["v4"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }

# Error handling
thiserror = "1"
anyhow    = "1"

# X.509 DER parsing — KMIP §11 Certificate attributes (CertificateSubjectCN,
# CertificateLength, CertificateIssuerCN, …) MUST be server-derived from the
# Certificate Value DER bytes. PKCS#11 stores the DER as an opaque CKA_VALUE
# blob with no parsing; the KMIP layer is responsible for the §11 attribute
# surface. x509-parser is a no-std-compatible RFC 5280 parser used widely
# (rustls-adjacent, Sequoia, ~7M/month downloads), MIT/Apache. PARSING only,
# no optional features enabled — default-features already excludes `verify`
# (the `ring`-backed `verify_signature`, wasm32-incompatible), which
# `validate.rs` used to opt into via `native`. Since the pure-Rust cert-ops
# port, §6.1.62 Validate checks certificate signatures via
# `ops::spki_verify::verify_with_spki` (the engine) instead — x509-parser
# supplies only the parsed fields (issuer/subject DN, validity window, raw
# TBS bytes, raw signature bytes), same as it always did for the §11
# attribute surface.
x509-parser = { version = "0.16" }

# RSA — KMIP 3.0 §6.1.48 Register accepts client-supplied RSA private
# keys in PKCS#1 (KeyFormatType=0x03) or PKCS#8 (0x04) DER form. The
# shim's CKM_*_RSA_PKCS / CKM_*_RSA_PKCS_PSS sign path reads PKCS#8
# from CKA_VALUE; we use the `rsa` crate's pkcs1::Decode + pkcs8::Encode
# traits to convert PKCS#1 → PKCS#8 at Register time. CS-AC-M-{1..6,8}
# pin this flow against a 2048-bit RSA-PSS signing key.
rsa = "0.9"

# K6 hybrid KEM + classical KEM: ALL asymmetric-KEM crypto now lives in the
# softhsmrustv3 engine (native::hybrid + native classical Encapsulate) — the
# KMIP layer holds no crypto crate. The former ml-kem / x25519-dalek / p256 /
# x448 deps were removed with the in-layer duplicate implementations
# (src/hybrid_kem.rs is a thin re-export; the Migration tab's in-layer
# src/dh_kem.rs was deleted in favour of the engine's classical Encapsulate).

# HTML parsing — only used by the build-time `extract-kmip-spec` tool
# (tools/extract_kmip_spec.rs). The OASIS KMIP 3.0 spec ships as Word-converted
# HTML with deeply nested span trees that defy regex-based extraction; a real
# DOM walker is the reliable path. Kept as a regular dep (not dev-) so the
# tool builds in normal `cargo build`. `native` only (bin-tool dependency).
scraper = { version = "0.20", optional = true }

[dev-dependencies]
proptest   = "1"
hex        = "0.4"
# P1.2 — tests/acvp_roundtrip.rs computes SHA-3 digests to KAT the NIST
# SHA3-256/512 vectors. Matches the engine's `../rust/Cargo.toml` pin so the
# digest implementation under test is byte-identical to the one the engine
# compiles against.
sha3       = "0.10.8"
test-case  = "3"
assert_cmd = "2"
predicates = "3"

# K9 — the PQC-Register e2e tests (tests/native_bridge_e2e.rs) generate
# FIPS 203/204/205 key material in-test and Register the raw bytes
# through the KMIP op handler. Versions mirror `../rust/Cargo.toml`;
# fips204/fips205 resolve to the local patched forks via the
# [patch.crates-io] section below.
fips204 = "0.4.6"
fips205 = "0.4.1"
# ml-kem is TEST-ONLY: the dispatcher/native-bridge integration tests build
# ML-KEM KAT vectors in-test. Production `src/` holds NO crypto crate — all
# hybrid-KEM crypto lives in the softhsmrustv3 engine (K6). x25519-dalek / p256
# were removed entirely (no longer used in src/ or tests/).
ml-kem = "0.2.3"
# rcgen is ALSO an optional `native`-gated [dependencies] entry above (the
# sandbox/dev TLS auto-gen). This second, unconditional copy exists purely
# because certify.rs's/validate.rs's `#[cfg(test)]` modules use it as an
# independent CSR/cert fixture generator — and since WP4 ungated those two
# modules entirely (no longer `#[cfg(feature = "native")]`), their tests
# now compile under `--no-default-features` too, where `dep:rcgen` isn't
# enabled. A `[dev-dependencies]` entry is available to every `cargo test`
# run regardless of feature flags, without pulling rcgen into the actual
# library artifact `--no-default-features` builds (dev-dependencies never
# ship in a `cargo build`, so this has zero effect on the wasm bundle).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }

# Mirror the patches from `pqctoday-hsm/rust/Cargo.toml` so the `softhsmrustv3`
# path dep above gets the FIPS-204 / FIPS-205 `Ph::SHA{224,384,3_*}` / `SHAKE256`
# variants it needs for PKCS#11 v3.2 §6.67.7 HashML-DSA + §6.69.7 HashSLH-DSA
# coverage. `[patch]` does not propagate across workspaces / standalone crates,
# so we duplicate it here. Same pattern as `openmls-provider/Cargo.toml`.
[patch.crates-io]
fips204 = { path = "../rust/fips204-patched" }
fips205 = { path = "../rust/fips205-patched" }
hbs-lms = { path = "../rust/hbs-lms-patched" }
