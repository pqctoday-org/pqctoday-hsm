[package]
name        = "pqctoday-kmip"
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
description = "KMIP 3.0 PQC + classical key management wrapper over pqctoday-hsm PKCS#11"
repository  = "https://github.com/pqctoday-org/pqctoday-hsm"

[lib]
name = "pqctoday_kmip"
path = "src/lib.rs"

[[bin]]
name = "pqctoday-kmip"
path = "bin/pqctoday-kmip.rs"

[[bin]]
name = "pqctoday-kmip-client"
path = "bin/pqctoday-kmip-client.rs"

[[bin]]
name = "pqctoday-kmip-compliance"
path = "bin/pqctoday-kmip-compliance.rs"

# Build-time spec extractor — walks OASIS KMIP 3.0 HTML to produce
# spec/oasis-kmip-3.0/kmip-spec-3.0-tags-enums.json. Run on demand:
# `cargo run --bin extract-kmip-spec`. Not a shipping binary.
[[bin]]
name = "extract-kmip-spec"
path = "tools/extract_kmip_spec.rs"

[dependencies]
# Plane 3 — direct Rust dependency on the engine, NO FFI
softhsmrustv3 = { path = "../rust" }

# Async runtime + I/O
tokio        = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls       = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# Self-signed cert auto-gen for sandbox / dev runs (Phase 7).
# Production deployments mount real certs via --tls-cert / --tls-key.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

# Persistence
rusqlite           = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

# Phase 2 — TTLV codec buffer ops. `bytes::BytesMut` matches the
# `fn encode(value: &Value, buf: &mut BytesMut)` signature in
# IMPLEMENTATION_PLAN.md §6 Phase 2. Decode side is hand-rolled
# nom-style position tracking against `&[u8]`.
bytes = "1"

# Phase 3 — UsageMask flag set in `src/kmip30/attrs.rs`. `bitflags`
# generates `contains`/`bits()`/bitwise-or so handler code reads
# flags by name rather than poking at raw `u32`.
bitflags = "2"

# Serialization (policy + spec JSON + compliance profiles)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing            = "0.1"
tracing-subscriber = "0.3"

# Crypto helpers (NOT for PQC — that's softhsmrustv3 — only for TLS bootstrap)
rand        = "0.8"
sha2        = "0.10"
hmac        = "0.12"

# IDs
uuid = { version = "1", features = ["v4"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }

# Error handling
thiserror = "1"
anyhow    = "1"

# X.509 DER parsing — KMIP §11 Certificate attributes (CertificateSubjectCN,
# CertificateLength, CertificateIssuerCN, …) MUST be server-derived from the
# Certificate Value DER bytes. PKCS#11 stores the DER as an opaque CKA_VALUE
# blob with no parsing; the KMIP layer is responsible for the §11 attribute
# surface. x509-parser is a no-std-compatible RFC 5280 parser used widely
# (rustls-adjacent, Sequoia, ~7M/month downloads), MIT/Apache.
x509-parser = "0.16"

# HTML parsing — only used by the build-time `extract-kmip-spec` tool
# (tools/extract_kmip_spec.rs). The OASIS KMIP 3.0 spec ships as Word-converted
# HTML with deeply nested span trees that defy regex-based extraction; a real
# DOM walker is the reliable path. Kept as a regular dep (not dev-) so the
# tool builds in normal `cargo build`.
scraper = "0.20"

[dev-dependencies]
proptest   = "1"
hex        = "0.4"
test-case  = "3"
assert_cmd = "2"
predicates = "3"

# Mirror the patches from `pqctoday-hsm/rust/Cargo.toml` so the `softhsmrustv3`
# path dep above gets the FIPS-204 / FIPS-205 `Ph::SHA{224,384,3_*}` / `SHAKE256`
# variants it needs for PKCS#11 v3.2 §6.67.7 HashML-DSA + §6.69.7 HashSLH-DSA
# coverage. `[patch]` does not propagate across workspaces / standalone crates,
# so we duplicate it here. Same pattern as `openmls-provider/Cargo.toml`.
[patch.crates-io]
fips204 = { path = "../rust/fips204-patched" }
fips205 = { path = "../rust/fips205-patched" }
