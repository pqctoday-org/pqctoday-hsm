openapi: "3.1.0"
info:
  title: CryptoPolicy Manager Admin API
  version: "1.0.0"
  description: |
    Admin facade for the pqctoday-kmip Crypto-Agility Control Plane (CACP).

    **Transport**: mTLS with X25519MLKEM768 hybrid KEM (TLS 1.3 only, aws-lc-rs
    provider). All requests require a client certificate signed by the CA
    generated by `--init-certs` (C0). Server and client certs stay classical
    ECDSA P-256; rustls 0.23 has no ML-DSA certificate support yet.

    **Error responses**: RFC 7807 `application/problem+json`
    — `{"type":"urn:pqctoday:cacp:problem/<code>","title":"…","status":N,"detail":"…"}`

servers:
  - url: https://pqc-kmip:5697
    description: Container default (internal Docker network)
  - url: https://localhost:5697
    description: Local dev / port-forward

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe (no mTLS required — used by readiness gates)
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /version:
    get:
      operationId: version
      summary: Server version and build info
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  /openapi.yaml:
    get:
      operationId: openapi
      summary: This OpenAPI 3.1 specification
      responses:
        "200":
          description: OpenAPI spec (application/yaml)
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/policies:
    get:
      operationId: listPolicies
      summary: List all policy names in the store
      responses:
        "200":
          description: Policy name list
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      type: string
              example:
                policies: [aead-only, training-permissive, pqc-required]
    post:
      operationId: createPolicy
      summary: Create a new policy (name derived from YAML metadata.name)
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              description: Full policy YAML (schema_version, metadata, rules)
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/policies/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        example: pqc-required
    get:
      operationId: getPolicy
      summary: Fetch a policy by name (includes raw YAML for round-trip editing)
      responses:
        "200":
          description: Policy with raw YAML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: savePolicy
      summary: Create or update a policy by name
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/active:
    get:
      operationId: getActive
      summary: Get the currently active (live) policy
      responses:
        "200":
          description: Active policy marker, or JSON null if no policy is active
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActivePolicy"
                  - type: "null"
    put:
      operationId: activatePolicy
      summary: |
        Activate a policy — takes effect immediately on the running dispatcher
        with no restart. The previous policy is displaced atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Name of an existing policy in the store
              example:
                name: pqc-required
      responses:
        "200":
          description: Policy activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/active-modules:
    get:
      operationId: getActiveModules
      summary: |
        List every active module (modular-policy plan, 2026-08-28) — mutually
        exclusive with `/api/v1/active` (legacy single-policy slot); whichever
        is non-empty is the one enforcing.
      responses:
        "200":
          description: Active module set, or an empty set if none are active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveModulesResponse"
    post:
      operationId: activateModule
      summary: |
        Activate (push/upsert) one scoped module. Refused (400) if the named
        policy has no `metadata.scopes`, if a legacy policy is active via
        `PUT /api/v1/active`, or if its scope is already claimed by a
        differently-named active module — deactivate that one first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Name of an existing, scoped policy in the store
              example:
                name: cnsa-2.0-signing
      responses:
        "200":
          description: Module activated
          content:
            application/json:
              schema:
                type: object
                required: [activated]
                properties:
                  activated:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: clearActiveModules
      summary: Deactivate every module at once (the fail-closed OFF switch)
      responses:
        "200":
          description: Module set cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: boolean
                    enum: [true]

  /api/v1/active-modules/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        example: cnsa-2.0-signing
    delete:
      operationId: deactivateModule
      summary: Deactivate one module by name
      responses:
        "200":
          description: |
            Always 200, even if no module by that name was active — check
            `found` to tell the two cases apart.
          content:
            application/json:
              schema:
                type: object
                required: [deactivated, found]
                properties:
                  deactivated:
                    type: string
                  found:
                    type: boolean
    patch:
      operationId: setModuleEnabled
      summary: |
        Enable/disable one active module in place without unloading it — a
        disabled module's rules stop applying but its scope stays claimed
        (nothing else can take it over while it's merely disabled).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: |
            Always 200, even if no module by that name was active — check
            `found`.
          content:
            application/json:
              schema:
                type: object
                required: [name, enabled, found]
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
                  found:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/config/uncovered-ops:
    get:
      operationId: getUncoveredOps
      summary: |
        Current fallback for a request whose op no active module's scope
        covers (modular mode only)
      responses:
        "200":
          description: Current mode
          content:
            application/json:
              schema:
                type: object
                required: [uncovered_ops]
                properties:
                  uncovered_ops:
                    type: string
                    enum: [deny, allow]
    put:
      operationId: setUncoveredOps
      summary: |
        Set the uncovered-ops fallback. `deny` (fail closed) is the only
        value a production deployment should use; `allow` (fail open) exists
        for the wasm playground and incremental adoption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [deny, allow]
      responses:
        "200":
          description: Mode set
          content:
            application/json:
              schema:
                type: object
                required: [uncovered_ops]
                properties:
                  uncovered_ops:
                    type: string
                    enum: [deny, allow]
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/validate:
    post:
      operationId: validatePolicy
      summary: Validate a policy draft without saving it
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Validation passed
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/dry-run:
    post:
      operationId: dryRunPolicy
      summary: |
        Dry-run a policy draft against a KMIP operation — returns the
        enforcement decision (allow / deny / rekey) without activating anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DryRunRequest"
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DryRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/audit:
    get:
      operationId: getAudit
      summary: |
        Tail the three-plane audit ring buffer (p1 policy / p2 KMIP / p3 PKCS#11).
        Events are newest-last; correlate across planes with correlation_id.
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return (default 200, max 2000)
          schema:
            type: integer
            default: 200
            maximum: 2000
            minimum: 1
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    description: Total events in the ring (may exceed limit)

  /api/v1/audit/stream:
    get:
      operationId: streamAudit
      summary: |
        Server-Sent Events stream of live audit events. The connection is kept
        open; each event is emitted as `data: {json}\n\n`. A `: heartbeat\n\n`
        comment is sent every 30 s to keep proxies alive. Slow consumers that
        fall more than 1 024 events behind receive a `event: lag` comment.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    VersionInfo:
      type: object
      required: [version, git_sha]
      properties:
        version:
          type: string
          description: Crate semver (CARGO_PKG_VERSION)
          example: "0.7.0"
        git_sha:
          type: string
          description: Git commit SHA (GIT_SHA env set by CI; "unknown" in dev)
          example: "d557bb4"

    PolicyDetail:
      type: object
      required: [name]
      properties:
        name:
          type: string
        yaml:
          type: string
          nullable: true
          description: Raw YAML content of the policy file (null if unreadable)

    SavedResponse:
      type: object
      required: [saved]
      properties:
        saved:
          type: string
          description: Name of the saved policy

    ActivePolicy:
      type: object
      required: [name, fingerprint]
      properties:
        name:
          type: string
        fingerprint:
          type: string
          description: SHA-256 hex digest of the policy YAML

    ActivatedResponse:
      type: object
      required: [activated]
      properties:
        activated:
          type: string
          description: Name of the newly active policy
        fingerprint:
          type: string
          nullable: true
          description: Fingerprint of the newly active policy

    ModuleMarker:
      type: object
      required: [name, fingerprint, enabled, activated_at]
      properties:
        name:
          type: string
        fingerprint:
          type: string
          description: SHA-256 hex digest of the module's policy YAML
        enabled:
          type: boolean
          description: |
            False if disabled in place via PATCH /api/v1/active-modules/{name}
            — the module stays activated (its scope stays claimed) but its
            rules are skipped during evaluation.
        activated_at:
          type: string
          format: date-time

    ActiveModulesResponse:
      type: object
      required: [uncovered_ops, modules]
      properties:
        uncovered_ops:
          type: string
          enum: [deny, allow]
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleMarker"

    DryRunRequest:
      type: object
      required: [yaml, op]
      properties:
        yaml:
          type: string
          description: Policy YAML to evaluate (does not need to be saved)
        op:
          type: string
          description: KMIP operation name (e.g. "Create", "Sign", "Locate")
          example: Sign
        algorithm:
          type: string
          description: Algorithm being requested (e.g. "ML-DSA-65", "RSA-2048")
          example: ML-DSA-65

    DryRunResponse:
      type: object
      required: [decision]
      properties:
        decision:
          type: object
          required: [outcome]
          properties:
            outcome:
              type: string
              enum: [allow, deny, rekey]
            reason:
              type: string
              description: Human-readable denial reason (present when outcome=deny)
            new_algorithm:
              type: string
              description: Replacement algorithm (present when outcome=rekey)

    Problem:
      type: object
      required: [type, title, status, detail]
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
          example: urn:pqctoday:cacp:problem/not-found
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "no policy named 'foo' in the store"

  responses:
    BadRequest:
      description: Bad request (malformed YAML, missing field, etc.)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
