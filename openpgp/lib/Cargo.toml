[package]
name = "openpgp-pkcs11-sequoia"
description = "A library for using PKCS #11 devices in an OpenPGP context."
version = "0.2.0"
repository = "https://codeberg.org/heiko/openpgp-pkcs11"
authors = ["Heiko Schaefer <heiko@schaefer.name>"]
license = "LGPL-2.0-or-later"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
log = "0.4"

# openpgp-x509-sequoia (0.2.0, abandoned, sequoia-1.x-pinned) is inlined into
# src/x509.rs — see PQC_PGP_IMPLEMENTATION_PLAN.md §2.3.

asn1-rs = "0.5"
# cryptoki 0.12 is required for native ML-DSA (Mechanism::MlDsa -> CKM_ML_DSA);
# 0.4 has no PQC mechanism at all. See plan §5.
cryptoki = "0.12"
cookie-factory = "0.3"
elliptic-curve = "0.13"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
picky-asn1-der = "0.4"
picky-asn1-x509 = "0.9"
rsa = "0.7"
sha2 = "0.10"
zeroize = "1"
# Sequoia pqc branch (2.2.0-pqc.1), pinned commit. crypto-openssl is mandatory:
# the default Nettle backend has no ML-DSA/ML-KEM. See plan §1/§2.1.
sequoia-openpgp = { git = "https://gitlab.com/sequoia-pgp/sequoia", rev = "3d05138bf1536e63886e7a079fa50aeb080ab573", default-features = false, features = ["crypto-openssl", "compression"] }
x509 = "0.2"
x509-certificate = "0.20"
