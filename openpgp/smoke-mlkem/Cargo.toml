# SPDX-License-Identifier: CC0
#
# P0-SEQUOIA-PQC-05 — §8 LIVE HSM ML-KEM SMOKE TEST harness.
#
# Standalone crate (own [workspace]) — proves softhsmv3 accepts a cryptoki-0.12
# `Mechanism::MlKem` C_EncapsulateKey / C_DecapsulateKey round-trip and that the
# recovered shared secret matches the encapsulated one. This proves the HSM
# *decapsulation* dispatch path the bridge's composite ML-KEM decryptor (§4,
# decryptor.rs `ml_kem_decapsulate`) relies on.
#
# Mirrors ../smoke-mldsa. Kept out of the openpgp/ workspace so its dep set does
# not touch the bridge lock.
[workspace]

[package]
name = "smoke-mlkem"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cryptoki = "0.12"
anyhow = "1"
