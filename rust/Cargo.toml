[package]
name = "softhsmrustv3"
version = "0.17.0"
edition = "2024"
description = "A native Rust WebAssembly clone of SoftHSMv3"

# hsm-perf-bench plan §A4.1/§P4 — makes this crate the workspace root, with
# `bench-harness/` as a sibling member. Purely structural: does not change
# this crate's own compiled output (cdylib/wasm/rlib) in any way, and
# `cargo build`/`cargo test` invoked from `rust/` for THIS package alone
# behave identically to before. What it DOES do: bench-harness now shares
# this file's `[patch.crates-io]` section (below) and this directory's
# Cargo.lock — patches only apply within a shared workspace, so a
# standalone sibling crate depending on this one via a bare path dependency
# would silently re-resolve the UNPATCHED upstream fips204/fips205 (same
# version number, missing the added Ph variants / _internal_*_external_mu
# functions this crate's own crypto/handlers.rs needs) — confirmed the
# hard way: bench-harness's first build failed on exactly those symbols
# before this workspace declaration was added.
[workspace]
members = ["bench-harness"]

[lib]
# `staticlib` added for the wasm32-unknown-emscripten target: emcc links the
# resulting .a into openssl.wasm so pkcs11-provider's C_GetFunctionList /
# C_GetInterface* externs resolve to this crate's ck_abi (see
# openssl-studio-pkcs11-wiring-plan-07242026.md WP1/WP2). cdylib+rlib
# outputs for the existing wasm-pack / native builds are unchanged.
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# Vendor ACVP known-answer-test hook: lets C_Initialize seed a deterministic
# ChaCha20 RNG via the CK_C_INITIALIZE_ARGS.pReserved field. This is a spec
# violation (PKCS#11 v3.2 §5.6 requires pReserved == NULL → CKR_ARGUMENTS_BAD).
#
# OPT-IN, NOT default. Every SHIPPED artifact (the `pqctoday-kmip` server
# binary, the in-browser wasm playground bundle, this crate's cdylib) builds
# WITHOUT it and is therefore §5.6-conformant by default. The KAT / ACVP /
# conformance harnesses that need deterministic RNG must opt in explicitly:
#   cargo test --features acvp          # engine's own FIPS KAT tests
#   cargo build --features acvp ...     # an authorized ACVP-lab submission
# (Was `default = ["acvp"]`; flipped to opt-in per the 2026-06-21 compliance
# audit — shipping a release build with this hook on is a §5.6 violation.)
default = []
acvp = []

# Exposes `reset_all_engine_state_for_test` as a normal `pub fn` (it is
# already always available under `#[cfg(test)]` for this crate's own
# tests) so a DIFFERENT crate's test build — kmip's — can reset the
# engine's global (`lazy_static!`) OBJECTS/SESSIONS/TOKEN_STORE state
# between its own tests, the same way `native::test_lock::acquire()`
# already does here. `#[cfg(test)]` alone cannot cross a crate boundary:
# it only applies to a crate's own test binary, never to a downstream
# crate depending on it normally. OPT-IN, dev-dependency only (see
# kmip/Cargo.toml) — never enabled by the production `[dependencies]`
# entry, so it never reaches the shipped `pqctoday-kmip` binary or any
# other consumer of this crate.
test-support = []

[dependencies]
wasm-bindgen = "0.2.117"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["console"] }
lazy_static = "1.4.0"

# Cryptography (Pure Rust replacements for OpenSSL/Botan)
getrandom = { version = "0.2.17", features = ["js"] }
# `sys_rng` added for `frodo-kem` (needs `rand_core 0.10`'s `CryptoRng`, not
# `rand 0.8`'s — see FrodoKEM keygen in native/keygen.rs). `wasm_js` remains
# for the existing browser/wasm32 entropy source.
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["wasm_js", "sys_rng"] }
rand = "0.8.5"
rand_chacha = "0.3"
aes = "0.8.3"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10"
# IETF ChaCha20 stream cipher (PKCS#11 v3.2 §6.20 `CKM_CHACHA20`).
# The AEAD variant is covered by `chacha20poly1305` above; the plain
# stream cipher needs this crate explicitly.
chacha20 = "0.9"
aes-kw = { version = "0.2", features = ["alloc"] }
cbc = "0.1.2"
ctr = "0.9.2"
# AES-XTS (CKM_AES_XTS, PKCS#11 v3.2 §6.15) — tweakable-cipher ciphertext
# stealing is genuinely easy to get subtly wrong by hand (unlike GMAC/CCM,
# which built on this engine's existing hand-rolled AesKey/GcmState with
# no compile-time generic-size friction); xts-mode has no such friction
# either (fixed 16-byte tweak, no variable tag/nonce length), so the
# battle-tested crate is the safer choice here specifically.
xts-mode = "0.5"
# AES-CMAC — SP 800-108 KBKDF PRF (CKM_AES_CMAC, PKCS#11 v3.2 §6.44) and a
# retained MAC mechanism. RustCrypto cmac 0.7 pairs with aes 0.8 / digest 0.10.
cmac = "0.7"
# SHA-1 — used ONLY for the CKA_CHECK_VALUE of generic-secret keys
# (PKCS#11 v3.2 §6.8.2: first 3 bytes of SHA-1(value)). Not a signing primitive.
sha1 = "0.10"
# RIPEMD-160 — historical digest + HMAC (CKM_RIPEMD160 / _HMAC, §6.x).
ripemd = "0.1"
# Incremental GHASH (NIST SP 800-38D §6.4) — needed to implement
# multi-part `C_EncryptUpdate` / `C_DecryptUpdate` for `CKM_AES_GCM`
# per PKCS#11 v3.2 §6.27.7. The high-level `aes-gcm` crate is
# one-shot only; `ghash` lets us stream the authentication tag.
ghash = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "digest"] }
# Ed448 (RFC 8032 §5.2 / PKCS#11 v3.2 §6.3.14's other permitted Edwards
# curve) — already present transitively via `x448` below (that crate only
# uses its Montgomery/X448 pieces); promoted to a direct dependency, pinned
# to the exact version already resolved in Cargo.lock so this doesn't shift
# x448's own resolution. `default-features = false` drops `std` (this crate
# targets wasm32) and `getrandom`/`pkcs8` (unused — keygen sources entropy
# via the same `getrandom_0_4`/`SysRng` path FrodoKEM already uses below,
# see the CKM_EC_EDWARDS_KEY_PAIR_GEN Ed448 arm in ffi.rs).
ed448-goldilocks = { version = "0.14.0-pre.11", default-features = false, features = ["alloc", "signing"] }
hmac = "0.12.1"
sp800-185 = "0.2.0"
pbkdf2 = "0.12"
hkdf = "0.12"
# `deterministic` exposes `KemCore::generate_deterministic(d, z)` — FIPS 203
# Algorithm 16 `ML-KEM.KeyGen_internal(d, z)` — used by the T7 CKA_SEED
# deterministic-keygen path (PKCS#11 v3.2 §6.68.2).
ml-kem = { version = "0.2.3", features = ["deterministic"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
pkcs8 = { version = "0.11.0-rc.11", features = ["alloc"] }  # TODO: upgrade when stable release available
# "hazmat" — the raw RSASP1/RSAVP1 modexp primitives (rsa::hazmat::
# rsa_decrypt/rsa_encrypt), needed by C_SignRecover/C_VerifyRecover's
# CKM_RSA_X_509 path and by CKM_RSA_PKCS verify-recover (the `rsa` crate's
# safe high-level API is verify-or-fail, not verify-and-recover). The
# padding-format check for the PKCS variant (rsa_pkcs1v15_unpad in ffi.rs)
# stays hand-written per RFC 8017 §9.2 rather than relying on any hazmat
# padding helper.
rsa = { version = "0.9", features = ["sha2", "hazmat"] }
# G12 — Split Key Polynomial Sharing Prime Field (PKCS#11 v3.2 has no
# secret-sharing mechanism to build on; this is a new vendor mechanism,
# CKM_PQCTODAY_SPLIT_KEY, implemented from KMIP 3.0 §13.1 directly).
# Already present transitively via `rsa`'s num-bigint-dig; a direct dep
# makes the modular-arithmetic API available here.
num-bigint = "0.4"
sha2 = "0.10.8"
# `oid` feature exposes the digest's AssociatedOid, required for PKCS#1 v1.5
# RSA signatures over SHA3 (CKM_SHA3_384_RSA_PKCS); SHA3-PSS does not need it.
sha3 = { version = "0.10.8", features = ["oid"] }
signature = "3.0.0-rc.10"  # TODO: upgrade when stable release available
spki = { version = "0.8.0-rc.4", features = ["alloc"] }  # TODO: upgrade when stable release available
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
x448 = { version = "0.14.0-pre.8", default-features = false, features = ["static_secrets"] }
console_error_panic_hook = "0.1.7"
zeroize = "1"
subtle = "2"

# Stateful hash-based signatures (G10)
hbs-lms = "0.1.1"

# Keccak-256 (G11 — Ethereum address derivation)
tiny-keccak = { version = "2.0", features = ["keccak"] }
# xmss crate implements both XMSS and XMSS-MT (RFC 8391); no separate xmssmt crate needed
xmss = "0.1.0-pre.0"
# Patched fips204/fips205: adds missing Ph variants (SHA224/384/SHA3-*/SHAKE256) for
# full PKCS#11 v3.2 §6.67.7 HashML-DSA and §6.69.7 HashSLH-DSA coverage
fips204 = "0.4.6"
fips205 = "0.4.1"

# BSI TR-02102-1 conservative KEMs (recommended alongside ML-KEM, not NIST-standardized).
# Both take an external CryptoRng parameter — no getrandom/OS-randomness call inside
# either crate, so no wasm32 RNG feature wiring is needed (verified against each
# crate's keygen signature before adding).
frodo-kem = { version = "0.1", default-features = false, features = [
    "frodo640aes", "frodo640shake", "frodo976aes", "frodo976shake", "frodo1344aes", "frodo1344shake",
] }
# Only one parameter-set feature may be enabled at a time (crate constraint — see
# cacp-frodokem-mceliece-softhsm-kmip-policy-plan-07062026.md Phase 0.5). Scoped to
# mceliece6688128 (BSI's Category-5 pick) for this initial slice; 460896/8192128
# follow-up tracked in that plan.
# v3+ required — v2.0.2's ciphertext included a non-spec confirmation-hash
# addition (K = H(1,e,C,H(2,e)) instead of the official spec's K = H(1,e,C));
# v3.1.0 fixed this, matching mceliece-spec-20221023.pdf and liboqs exactly
# (verified directly against both sources' source code — see the FrodoKEM/
# Classic-McEliece/HQC implementation plan).
classic-mceliece-rust = { version = "3", default-features = false, features = ["mceliece6688128", "alloc", "zeroize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native store backend (`store::sqlite`) — target-gated as a DEPENDENCY,
# not a Cargo feature someone has to remember to omit. `target_arch =
# "wasm32"` covers both wasm32-unknown-unknown (the hub's embedded
# playground build, `pqctoday-hub/src/wasm/softhsmrustv3_bg.wasm`) and
# wasm32-unknown-emscripten (the openssl.wasm staticlib) in one predicate,
# so rusqlite's bundled C SQLite is never even in the dependency graph for
# either wasm target — matching the C++ engine's own decision to force its
# `WITH_OBJECTSTORE_BACKEND_DB` off for its WebAssembly build
# (`CMakeLists.txt:21-22`) rather than trying to cross-compile SQLite
# through emcc. kmip/Cargo.toml gates rusqlite the same way, via its
# `native` feature, for the identical reason.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# NIST ACVP keyGen KAT parsing (T7 seed-deterministic keygen tests reads
# the internalProjection.json vector files shipped with the patched forks).
serde_json = "1"
# Cross-validation oracle only (Phase 0.9/0.6 of the FrodoKEM/McEliece/HQC plan) —
# native liboqs bindings, dev-dependency only so it never has to cross the wasm32
# target; the engine's shipping crypto never depends on this.
oqs = { version = "0.10", default-features = false, features = ["kems", "vendored"] }

[patch.crates-io]
fips204 = { path = "fips204-patched" }
fips205 = { path = "fips205-patched" }
# SP 800-208 SHAKE-256 type-ID support: upstream 0.1.1 serializes SHA-256
# type codes for all hash families (gap-analysis hbs-lms finding; mirrors
# the C++ engine's patched hash-sigs submodule).
hbs-lms = { path = "hbs-lms-patched" }

[profile.release]
# Optimize purely for size in WASM
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

